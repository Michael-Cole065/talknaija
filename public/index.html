<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalkNaija</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="topbar">
<h2>🎙 TalkNaija</h2>
</header>

<div id="homeScreen" class="screen">

    <div class="home-card">

        <h1>Connect with Nigerians</h1>

        <p>
            Random anonymous voice conversations.
        </p>

        <div class="online-box">

            🟢 Online:
            <span id="onlineUsers">0</span>

            <p>
                People waiting:
                <span id="queueCount">0</span>
            </p>

        </div>

        <button id="startBtn">
            Start Talking
        </button>

        <!-- CALL HISTORY -->

        <div
            id="callHistorySection"
            class="call-history"
        >

            <h2>🕘 Call History</h2>

            <p
                id="historyLimitText"
                class="history-limit"
            >
                Your last 5 calls
            </p>

            <div id="callHistoryList">

                <p class="history-empty">
                    No call history yet.
                </p>

            </div>

        </div>

    </div>

</div>

<!-- SEARCH SCREEN -->
<div id="searchScreen" class="screen hidden">

    <div class="home-card">

        <h2>🔎 Searching...</h2>

        <div class="loader"></div>

        <p id="status">
            Finding another Nigerian...
        </p>

        <button id="cancelBtn">
            Cancel Search
        </button>

    </div>

</div>

<!-- CALL SCREEN -->
<div id="callScreen" class="screen hidden">

    <div class="home-card">

	<h2>🎙 Anonymous User</h2>

	<p id="connectionStatus">
	Connecting...
	</p>
        <h1 id="timer">00:00</h1>

        <button id="muteBtn">
            Mute
        </button>

        <br><br>

        <button id="endBtn">
            End Call
        </button>
	
	<br><br>

	<button id="nextBtn">
    	    Next Person
	</button>
        
	<br><br>

        <button id="reportBtn">
            Report
        </button>

	<audio id="remoteAudio" autoplay playsinline></audio>

	<div id="debugBox" style="margin-top:20px; padding:10px; background:#111; color:#0f0; font-size:12px; text-align:left; max-height:150px; overflow:auto;">
	    WebRTC Debug:<br>

	</div>
    </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/socket.js"></script>
<script src="js/webrtc.js?v=2"></script>
<script src="js/app.js"></script>

</body>
</html>
