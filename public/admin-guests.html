<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TalkNaija Admin - Guests</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            background: #0d1730;
            color: white;
            border-radius: 15px;
            padding: 22px;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0 0 6px;
        }

        .header p {
            margin: 0;
            opacity: 0.75;
        }

        .page {
            background: white;
            border-radius: 14px;
            padding: 20px;
            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }

        .back {
            display: inline-block;
            margin-bottom: 18px;
            padding: 10px 14px;
            border-radius: 8px;
            background: #111;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .summary {
            margin-bottom: 18px;
            font-weight: bold;
        }

        .user {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .user-id {
            font-weight: bold;
            word-break: break-all;
        }

        .user-id button {
            border: 0;
            background: none;
            padding: 0;
            font: inherit;
            color: inherit;
            cursor: pointer;
            text-decoration: underline;
        }

        .status {
            padding: 5px 9px;
            border-radius: 6px;
            background: #eee;
            font-size: 13px;
            font-weight: bold;
        }

        .details {
            color: #555;
            font-size: 14px;
            line-height: 1.7;
        }

        .details strong {
            color: #111;
        }

        .empty,
        .error {
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            background: #f5f5f5;
        }

        .error {
            color: #b00020;
        }

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .header {
                padding: 18px;
            }

            .page {
                padding: 15px;
            }

            .user-header {
                align-items: flex-start;
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <header class="header">

        <h1>
            TalkNaija Admin
        </h1>

        <p>
            Moderation & Support Control Center
        </p>

    </header>

    <main class="page">

        <a
            href="/admin.html"
            class="back"
        >
            ← Back to Dashboard
        </a>

        <h2>
            👤 Guests
        </h2>

        <div
            id="summary"
            class="summary"
        >
            Loading guests...
        </div>

        <div id="users">
            Loading guests...
        </div>

    </main>

</div>

<script>

function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

async function loadUsers() {

    const container =
        document.getElementById("users");

    const summary =
        document.getElementById("summary");

    try {

        const response =
            await fetch("/api/admin/guests");

        if (!response.ok) {
            throw new Error(
                "Failed to load guests."
            );
        }

        const data =
            await response.json();

        const users =
            data.users || [];

        users.sort(
            (a, b) =>
                new Date(b.lastActive) -
                new Date(a.lastActive)
        );

        summary.textContent =
            `${data.count || 0} guests`;

        if (!users.length) {

            container.innerHTML = `
                <div class="empty">
                    No guests recorded yet.
                </div>
            `;

            return;

        }

        container.innerHTML =
            users.map(user => `

                <div class="user">

                    <div class="user-header">

                        <div class="user-id">

                            👤

                            <button
                                type="button"
                                onclick="showUserHistory('${escapeHtml(user.uuid)}')"
                            >
                                ${escapeHtml(user.uuid)}
                            </button>

                        </div>

                        <div class="status">
                            ${escapeHtml(user.type || "guest")}
                        </div>

                    </div>

                    <div class="details">

                        <div>
                            <strong>
                                First Seen:
                            </strong>

                            ${user.firstSeen
                                ? new Date(
                                    user.firstSeen
                                ).toLocaleString()
                                : "Unknown"
                            }

                        </div>

                        <div>
                            <strong>
                                Last Active:
                            </strong>

                            ${user.lastActive
                                ? new Date(
                                    user.lastActive
                                ).toLocaleString()
                                : "Unknown"
                            }

                        </div>

                        <div>
                            <strong>
                                Connections:
                            </strong>

                            ${user.connectionCount || 0}

                        </div>

                        <div>
                            <strong>
                                Visits:
                            </strong>

                            ${user.visitCount || 0}

                        </div>

                        <div>
                            <strong>
                                Reports:
                            </strong>

                            ${user.reportCount || 0}

                        </div>

                    </div>

                </div>

            `).join("");

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="error">
                Unable to load guests.
            </div>
        `;

        summary.textContent =
            "Unable to load guests.";

    }

}

async function showUserHistory(uuid) {

    if (!uuid) {
        return;
    }

    let modal =
        document.getElementById("historyModal");

    if (!modal) {

        modal =
            document.createElement("div");

        modal.id =
            "historyModal";

        modal.style.cssText = `
            position:fixed;
            inset:0;
            z-index:9999;
            background:rgba(0,0,0,0.65);
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
            overflow-y:auto;
        `;

        document.body.appendChild(modal);

        document.body.style.overflow = "hidden";

    }

    modal.innerHTML = `
        <div
            style="
                background:#fff;
                width:100%;
                max-width:900px;
                max-height:90vh;
                overflow-y:auto;
                border-radius:14px;
                padding:20px;
                box-shadow:0 10px 40px rgba(0,0,0,0.3);
            "
        >

            <div
                style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                    gap:10px;
                    margin-bottom:20px;
                "
            >
                <h2 style="margin:0;">
                    🔎 User History
                </h2>

                <button
                    type="button"
                    onclick="closeUserHistory()"
                    style="
                        border:0;
                        background:#111;
                        color:#fff;
                        padding:8px 12px;
                        border-radius:8px;
                        cursor:pointer;
                        font-weight:bold;
                    "
                >
                    Close
                </button>
            </div>

            <div class="details">
                Loading user history...
            </div>

        </div>
    `;

    try {

        const response =
            await fetch(
                `/api/admin/users/${encodeURIComponent(
                    uuid
                )}/history`
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "User history request failed."
            );

        }

        const visits =
            data.visits || [];

        const reports =
            data.reports || [];

        const calls =
            data.callHistory || [];

        const content =
            modal.querySelector(
                ".details"
            ).parentElement;

        content.innerHTML = `

            <div
                style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                    gap:10px;
                    margin-bottom:20px;
                "
            >
                <h2 style="margin:0;">
                    🔎 User History
                </h2>

                <button
                    type="button"
                    onclick="closeUserHistory()"
                    style="
                        border:0;
                        background:#111;
                        color:#fff;
                        padding:8px 12px;
                        border-radius:8px;
                        cursor:pointer;
                        font-weight:bold;
                    "
                >
                    Close
                </button>
            </div>

            <div class="report">

                <h3>
                    👤 User
                </h3>

                <div class="details">

                    <div>
                        <strong>UUID:</strong>
                        ${escapeHtml(
                            data.user.uuid
                        )}
                    </div>

                    <div>
                        <strong>Type:</strong>
                        ${escapeHtml(
                            data.user.type
                        )}
                    </div>

                    <div>
                        <strong>Premium:</strong>
                        ${
                            data.user.isPremium
                            ? "Yes"
                            : "No"
                        }
                    </div>

                    <div>
                        <strong>First Seen:</strong>
                        ${data.user.firstSeen
                            ? new Date(
                                data.user.firstSeen
                            ).toLocaleString()
                            : "Unknown"
                        }
                    </div>

                    <div>
                        <strong>Last Active:</strong>
                        ${data.user.lastActive
                            ? new Date(
                                data.user.lastActive
                            ).toLocaleString()
                            : "Unknown"
                        }
                    </div>

                </div>

            </div>

            <div class="report">

                <h3>
                    🌐 Visits (${visits.length})
                </h3>

                ${
                    visits.length
                    ? visits.map(
                        visit => `
                            <div class="details">

                                ${visit.timestamp
                                    ? new Date(
                                        visit.timestamp
                                    ).toLocaleString()
                                    : "Unknown"
                                }

                                —
                                ${escapeHtml(
                                    visit.type || "guest"
                                )}

                            </div>
                        `
                    ).join("")
                    : `
                        <div class="empty">
                            No visits.
                        </div>
                    `
                }

            </div>

            <div class="report">

                <h3>
                    🚨 Reports (${reports.length})
                </h3>

                ${
                    reports.length
                    ? reports.map(
                        report => `
                            <div class="details">

                                <strong>
                                    ${escapeHtml(
                                        report.reason
                                    )}
                                </strong>

                                —
                                ${escapeHtml(
                                    report.status
                                )}

                            </div>
                        `
                    ).join("")
                    : `
                        <div class="empty">
                            No reports.
                        </div>
                    `
                }

            </div>

            <div class="report">

                <h3>
                    📞 Call History (${calls.length})
                </h3>

                ${
                    calls.length
                    ? calls.map(
                        (call, index) => `
                            <div
                                class="details"
                                style="
                                    margin-bottom:12px;
                                    padding:12px;
                                    border:1px solid #ddd;
                                    border-radius:8px;
                                "
                            >

                                <strong>
                                    Call #${index + 1}
                                </strong>

                                <br><br>

                                <strong>
                                    Partner ID:
                                </strong>

                                ${escapeHtml(
                                    call.partnerId || "Unknown"
                                )}

                                <br>

                                <strong>
                                    Timestamp:
                                </strong>

                                ${
                                    call.timestamp
                                    ? new Date(
                                        call.timestamp
                                    ).toLocaleString()
                                    : "Unknown"
                                }

                                <br>

                                <strong>
                                    Callback Status:
                                </strong>

                                ${escapeHtml(
                                    call.callbackStatus || "Unknown"
                                )}

                                <br>

                                <strong>
                                    Decline Count:
                                </strong>

                                ${escapeHtml(
                                    call.declineCount ?? 0
                                )}

                            </div>
                        `
                    ).join("")
                    : `
                        <div class="empty">
                            No call history.
                        </div>
                    `
                }

            </div>

        `;

    } catch (error) {

        console.error(
            "User history error:",
            error
        );

        modal.querySelector(
            ".details"
        ).innerHTML = `
            <div class="error">
                ${escapeHtml(
                    error.message
                )}
            </div>
        `;

    }

}

function closeUserHistory() {

    const modal =
        document.getElementById(
            "historyModal"
        );

    if (modal) {
        modal.remove();
        document.body.style.overflow = "";
    }

}

loadUsers();

</script>

</body>

</html>
