<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TalkNaija Admin — Traffic</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;
            padding: 20px;

            font-family:
                Arial,
                sans-serif;

            background: #f5f5f5;
            color: #111;

        }

        .container {

            max-width: 1100px;
            margin: auto;

        }

        .header {

            background: #0d1730;
            color: white;

            border-radius: 15px;

            padding: 22px;

            margin-bottom: 20px;

        }

        .header h1 {

            margin: 0 0 6px;

        }

        .header p {

            margin: 0;
            opacity: 0.75;

        }

        .page {

            background: white;

            border-radius: 14px;

            padding: 20px;

            box-shadow:
                0 2px 8px
                rgba(0,0,0,0.08);

        }

        .page-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 20px;

        }

        .page-header h2 {

            margin: 0 0 6px;

        }

        .page-header p {

            margin: 0;

            color: #666;

        }

        .back {

            display: inline-block;

            margin-bottom: 18px;

            padding: 10px 14px;

            border-radius: 8px;

            background: #111;

            color: white;

            text-decoration: none;

            font-weight: bold;

        }

        button {

            border: 0;

            border-radius: 8px;

            padding: 10px 15px;

            cursor: pointer;

            font-weight: bold;

        }

        .primary {

            background: #0d1730;

            color: white;

        }

        .traffic-list {

            display: flex;

            flex-direction: column;

            gap: 12px;

        }

        .traffic-item {

            border: 1px solid #e5e5e5;

            border-radius: 12px;

            padding: 16px;

            background: #fafafa;

        }

        .traffic-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 12px;

            margin-bottom: 12px;

        }

        .traffic-type {

            font-weight: bold;

        }

        .status {

            padding: 5px 9px;

            border-radius: 20px;

            background: #e8edf7;

            font-size: 13px;

            font-weight: bold;

            white-space: nowrap;

        }

        .details {

            display: flex;

            flex-direction: column;

            gap: 7px;

            color: #555;

            font-size: 14px;

        }

        .details strong {

            color: #111;

        }

        .empty {

            padding: 30px;

            text-align: center;

            color: #666;

            border: 1px dashed #ccc;

            border-radius: 12px;

        }

        .error {

            padding: 20px;

            color: #b00020;

            background: #fff0f0;

            border-radius: 10px;

        }

        .summary {

            margin-bottom: 18px;

            padding: 15px;

            border-radius: 10px;

            background: #f5f5f5;

        }

        .summary strong {

            font-size: 20px;

        }

        @media (max-width: 600px) {

            body {

                padding: 12px;

            }

            .header {

                padding: 18px;

            }

            .page {

                padding: 15px;

            }

            .page-header {

                align-items: stretch;

                flex-direction: column;

            }

            .page-header button {

                width: 100%;

            }

        }

    </style>

</head>

<body>

<div class="container">

    <header class="header">

        <h1>
            TalkNaija Admin
        </h1>

        <p>
            Moderation & Support Control Center
        </p>

    </header>

    <main class="page">

        <a
            href="/admin.html"
            class="back"
        >
            ← Back to Dashboard
        </a>

        <div class="page-header">

            <div>

                <h2>
                    🌐 Traffic
                </h2>

                <p>
                    Complete recent visitor activity.
                </p>

            </div>

            <button
                class="primary"
                onclick="loadTraffic()"
            >
                Refresh
            </button>

        </div>

        <div
            id="trafficSummary"
            class="summary"
        >
            Loading traffic...
        </div>

        <div
            id="trafficList"
            class="traffic-list"
        ></div>

    </main>

</div>

<script>

async function loadTraffic() {

    const summary =
        document.getElementById(
            "trafficSummary"
        );

    const container =
        document.getElementById(
            "trafficList"
        );

    try {

        const response =
            await fetch(
                "/api/admin/traffic?limit=1000"
            );

        if (!response.ok) {

            throw new Error(
                "Failed to load traffic."
            );

        }

        const data =
            await response.json();

        const visits =
            Array.isArray(data.visits)
                ? data.visits
                : [];

        summary.innerHTML = `
            Total Visits:
            <strong>
                ${data.totalVisits || 0}
            </strong>
        `;

        if (visits.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    No traffic recorded yet.
                </div>
            `;

            return;

        }

        container.innerHTML =
            visits.map(
                (visit) => `

                    <div
                        class="traffic-item"
                    >

                        <div
                            class="traffic-header"
                        >

                            <div
                                class="traffic-type"
                            >

                                ${
                                    visit.type ===
                                    "premium"
                                        ? "⭐"
                                        : "👤"
                                }

                                ${
                                    escapeHtml(
                                        visit.type ||
                                        "guest"
                                    )
                                }

                            </div>

                            <div
                                class="status"
                            >

                                ${
                                    visit.isPremium
                                        ? "Premium"
                                        : "Guest"
                                }

                            </div>

                        </div>

                        <div
                            class="details"
                        >

                            <div>

                                <strong>
                                    User:
                                </strong>

                                ${
                                    escapeHtml(
                                        visit.uuid ||
                                        "Unknown"
                                    )
                                }

                            </div>

                            <div>

                                <strong>
                                    Visit:
                                </strong>

                                ${
                                    visit.timestamp
                                        ? new Date(
                                            visit.timestamp
                                          ).toLocaleString()
                                        : "Unknown"
                                }

                            </div>

                        </div>

                    </div>

                `
            ).join("");

    } catch (error) {

        console.error(
            "Traffic page error:",
            error
        );

        summary.textContent =
            "Unable to load traffic.";

        container.innerHTML = `
            <div class="error">
                Could not load traffic.
            </div>
        `;

    }

}


function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


loadTraffic();

</script>

</body>

</html>
