<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Account Restricted — TalkNaija</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111;
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: #fff;
            border-radius: 18px;
            padding: 32px 24px;
            text-align: center;
            box-shadow:
                0 8px 30px rgba(0,0,0,0.08);
        }

        .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffe5e5;
            font-size: 34px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 25px;
        }

        p {
            margin: 0;
            line-height: 1.6;
            color: #555;
        }

        .notice {
            margin-top: 22px;
            padding: 14px;
            border-radius: 10px;
            background: #f5f5f5;
            font-size: 14px;
            color: #444;
        }

        .brand {
            margin-top: 26px;
            font-weight: bold;
            color: #111;
        }

    </style>
</head>

<body>

    <main class="card">

        <div class="icon">
            🚫
        </div>

        <h1>
            Account Restricted
        </h1>

        <p>
            Your TalkNaija account has been temporarily
            restricted due to multiple reports.
        </p>

        <div class="notice">
            You cannot access TalkNaija calls or the
            matching queue while this restriction is active.
        </div>

        <div class="brand">
            TalkNaija
        </div>

    </main>

</body>
</html>
