<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TalkNaija Admin — Reports</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            background: #0d1730;
            color: white;
            border-radius: 15px;
            padding: 22px;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0 0 6px;
        }

        .header p {
            margin: 0;
            opacity: 0.75;
        }

        .page {
            background: white;
            border-radius: 14px;
            padding: 20px;
            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }

        .back {
            display: inline-block;
            margin-bottom: 18px;
            padding: 10px 14px;
            border-radius: 8px;
            background: #111;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .page-header h2 {
            margin: 0;
        }

        .refresh {
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            background: #174ea6;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .report {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            background: #fff;
        }

        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 14px;
        }

        .reason {
            font-weight: bold;
            font-size: 16px;
        }

        .status {
            background: #e8f1ff;
            color: #174ea6;
            padding: 6px 9px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .details {
            line-height: 1.6;
            color: #444;
        }

        .details div {
            margin-bottom: 5px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .actions button {
            border: 0;
            border-radius: 8px;
            padding: 9px 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .blue {
            background: #e8f1ff;
            color: #174ea6;
        }

        .primary {
            background: #174ea6;
            color: white;
        }

        .danger {
            background: #ffe8e8;
            color: #b00020;
        }

        .empty {
            padding: 35px 20px;
            text-align: center;
            color: #666;
        }

        .error {
            padding: 20px;
            border-radius: 10px;
            background: #ffe8e8;
            color: #b00020;
        }

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .header {
                padding: 18px;
            }

            .page {
                padding: 15px;
            }

            .page-header {
                align-items: flex-start;
            }

            .report-header {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <header class="header">

        <h1>
            TalkNaija Admin
        </h1>

        <p>
            Moderation & Support Control Center
        </p>

    </header>

    <main class="page">

        <a
            href="/admin.html"
            class="back"
        >
            ← Back to Dashboard
        </a>

        <div class="page-header">

            <h2>
                🚨 Reports
            </h2>

            <button
                class="refresh"
                onclick="loadReports()"
            >
                Refresh
            </button>

        </div>

        <div id="reports">
            Loading reports...
        </div>

    </main>

</div>

<script>

async function loadReports() {

    const container =
        document.getElementById("reports");

    try {

        const response =
            await fetch("/api/reports");

        if (!response.ok) {

            throw new Error(
                "Failed to load reports."
            );

        }

        const reports =
            await response.json();

        if (!Array.isArray(reports) ||
            reports.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    <h3>
                        No reports
                    </h3>

                    <p>
                        There are currently
                        no user reports.
                    </p>
                </div>
            `;

            return;
        }

        container.innerHTML =
            reports
                .slice()
                .reverse()
                .map(
                    (report) => `

                        <div class="report">

                            <div class="report-header">

                                <div class="reason">
                                    🚨
                                    ${escapeHtml(
                                        report.reason
                                    )}
                                </div>

                                <div class="status">
                                    ${escapeHtml(
                                        report.status
                                    )}
                                </div>

                            </div>

                            <div class="details">

                                <div>
                                    <strong>
                                        Reporter:
                                    </strong>

                                    ${escapeHtml(
                                        report.reporter
                                    )}
                                </div>

                                <div>
                                    <strong>
                                        Reported:
                                    </strong>

                                    ${escapeHtml(
                                        report.reported
                                    )}
                                </div>

                                <div>
                                    <strong>
                                        Created:
                                    </strong>

                                    ${new Date(
                                        report.createdAt
                                    ).toLocaleString()}
                                </div>

                            </div>

                            <div class="actions">

                                <button
                                    class="blue"
                                    onclick="updateReport(
                                        '${report.id}',
                                        'reviewed'
                                    )"
                                >
                                    Mark Reviewed
                                </button>

                                <button
                                    class="danger"
                                    onclick="updateReport(
                                        '${report.id}',
                                        'action_taken'
                                    )"
                                >
                                    Action Taken
                                </button>

                                <button
                                    class="primary"
                                    onclick="${
                                        report.blocked
                                            ? `unblockPair('${report.id}')`
                                            : `blockPair('${report.id}')`
                                    }"
                                >
                                    ${
                                        report.blocked
                                            ? "Unblock"
                                            : "Block"
                                    }
                                </button>

                                <button
                                    class="muted"
                                    onclick="updateReport(
                                        '${report.id}',
                                        'dismissed'
                                    )"
                                >
                                    Dismiss
                                </button>

                            </div>

                        </div>

                    `
                )
                .join("");

    } catch (error) {

        console.error(
            "Reports page error:",
            error
        );

        container.innerHTML = `
            <div class="error">
                Could not load reports.
            </div>
        `;

    }

}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


async function updateReport(
    id,
    status
) {

    try {

        const response =
            await fetch(
                "/api/reports/" +
                encodeURIComponent(id),
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        status
                    })
                }
            );

        if (!response.ok) {

            throw new Error(
                "Failed to update report."
            );

        }

        await loadReports();

    } catch (error) {

        console.error(error);

        alert(
            "Could not update the report."
        );

    }

}


async function blockPair(id) {

    try {

        const response =
            await fetch(
                "/api/reports/" +
                encodeURIComponent(id) +
                "/block",
                {
                    method: "POST"
                }
            );

        if (!response.ok) {

            throw new Error(
                "Failed to block pair."
            );

        }

        await loadReports();

    } catch (error) {

        console.error(error);

        alert(
            "Could not block the pair."
        );

    }

}


async function unblockPair(id) {

    try {

        const response =
            await fetch(
                "/api/reports/" +
                encodeURIComponent(id) +
                "/unblock",
                {
                    method: "POST"
                }
            );

        if (!response.ok) {

            throw new Error(
                "Failed to unblock pair."
            );

        }

        await loadReports();

    } catch (error) {

        console.error(error);

        alert(
            "Could not unblock the pair."
        );

    }

}


loadReports();

</script>

</body>

</html>
